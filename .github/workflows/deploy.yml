name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить сборку руками из вкладки Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний коммит.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Настройки облака задаются в Settings -> Secrets and variables -> Actions
      # одним из двух способов, на выбор:
      #
      #   SUPABASE               — целиком содержимое .env, обеими строками сразу;
      #   VITE_SUPABASE_URL
      #   VITE_SUPABASE_ANON_KEY — либо два отдельных секрета.
      #
      # Если секретов нет вообще, сайт соберётся и будет работать: адрес и ключ
      # можно ввести прямо в настройках на странице.
      - name: Собрать .env из секретов
        env:
          SUPABASE_ENV: ${{ secrets.SUPABASE }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ENV" ]; then
            # tr убирает возврат каретки: секрет мог быть скопирован из Windows,
            # и \r иначе приклеился бы к адресу, сделав его нерабочим.
            printf '%s\n' "$SUPABASE_ENV" | tr -d '\r' > .env
          elif [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_KEY" > .env
          else
            echo 'Секреты не заданы — сайт соберётся без настроек облака.'
          fi
          # Проверяем результат, не показывая значения.
          if [ -f .env ]; then
            grep -c '^VITE_SUPABASE_' .env | xargs -I {} echo 'Переменных облака в .env: {}'
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
